<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Matrix</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- PAGE 1: LANDING & SLIDESHOW -->
    <div id="landingPage" class="page active">
        <div class="hero-content">
            <h1 class="glow-title">Menu Matrix</h1>
            <p>Your AI-powered culinary companion for any craving or diet.</p>
            
            <!-- Slideshow Container -->
            <div class="slideshow-container">
                <div class="slide fade"><img src="https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&w=600&q=80" alt="Fresh Salad"></div>
                <div class="slide fade"><img src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?auto=format&fit=crop&w=600&q=80" alt="Delicious Pizza"></div>
                <div class="slide fade"><img src="https://images.unsplash.com/photo-1555939594-58d7cb561ad1?auto=format&fit=crop&w=600&q=80" alt="Grilled Food"></div>
            </div>

            <!-- Big Call-to-Action Button -->
            <button class="mega-btn" onclick="goToApp()">Enter the Matrix 🚀</button>
        </div>
    </div>

    <!-- PAGE 2: THE AI GENERATOR APP (Initially Hidden) -->
    <div id="appPage" class="page hidden">
        <div class="card">
            <button class="back-btn" onclick="goToLanding()">← Back to Home</button>
            <h2>Menu Matrix AI</h2>
            <p>Tell me what you're craving or your dietary constraints!</p>
            
            <textarea id="userInput" placeholder="e.g. Asian cuisine, vegan, allergic to peanuts..."></textarea>
            
            <button class="action-btn" onclick="getMealSuggestion()">Decide My Meal</button>
            
            <div id="result"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
