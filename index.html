<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Matrix</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            max-width: 480px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            color: #1a1a1a;
            margin-bottom: 8px;
        }

        p {
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 24px;
            line-height: 1.4;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 12px 16px;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            font-size: 0.95rem;
            resize: none;
            outline: none;
            transition: border-color 0.2s ease;
            margin-bottom: 16px;
        }

        textarea:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        button:active {
            transform: scale(0.99);
        }

        #result {
            margin-top: 24px;
            padding: 16px;
            background-color: #f8fafc;
            border-radius: 10px;
            color: #334155;
            font-size: 0.95rem;
            line-height: 1.5;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Menu Matrix 🍽️</h1>
        <p>Can't decide what to eat? Tell me what you're craving or your dietary constraints!</p>
        
        <textarea id="userInput" placeholder="e.g. Asian cuisine, allergic to peanuts, quick recipe to cook..."></textarea>
        <button onclick="getMealSuggestion()">Decide My Meal</button>
        
        <div id="result">Your recommendation will appear here...</div>
    </div>

    <script src="app.js"></script>
</body>
</html>
